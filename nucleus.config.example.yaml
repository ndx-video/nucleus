# Nucleus — honesty harness config (source of truth)
#
# Docs: docs/index.md
#
# Setup:
#   1. Install:  pi install git:github.com/ndx-au/nucleus
#      (project-local: pi install -l git:github.com/ndx-au/nucleus)
#   2. Copy this file to your project root as:  nucleus.yaml
#      (optional global: ~/.nucleus/nucleus.yaml — project wins on merge)
#   3. Set models.* to provider/model-id values configured in your Pi setup
#   4. In Pi: /nucleus
#
# Local state (auto-created, gitignore recommended):
#   .nucleus/state.json           — phase machine
#   .nucleus/specs/               — Spec drafts (default current.md)
#   .nucleus/attestations/        — harness-captured attestations
#   .nucleus/attest.key           — project-local HMAC secret (do not commit)
#   .nucleus/review-bundle.md     — last Review Bundle (audit)
#   .nucleus/review-session.json  — isolation mode of last /review
#
# Model refs: provider/model-id
# Examples: anthropic/claude-sonnet-4, openai/gpt-4.1, ollama/llama3.2, xai/grok-4

models:
  planner: "anthropic/claude-opus-4"        # prefer SOTA for planning
  implementer: "anthropic/claude-sonnet-4" # mid-tier is fine
  reviewer: "openai/gpt-4.1"               # different model recommended

roles:
  implementer:
    # nucleus_attest is always injected by the harness if omitted
    allowed_tools:
      - read
      - write
      - edit
      - bash
      - grep
      - find
      - ls
      - nucleus_attest
  reviewer:
    # No write/edit by default. nucleus_verify is always injected if omitted.
    allowed_tools:
      - read
      - bash
      - grep
      - find
      - ls
      - nucleus_verify
    adversarial: true

attestation:
  required: true                          # /review blocked without verified att
  store_path: ".nucleus/attestations/"    # relative to project root
  require_real_stdout: true               # flag empty success in capture notes
